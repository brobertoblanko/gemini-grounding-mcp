name: Weekly update

on:
  schedule:
    # Tuesdays 05:17 UTC: a day after Dependabot's Monday run, so its pull
    # requests and their CI runs are done; off the full hour, when GitHub's
    # scheduler is busiest.
    - cron: "17 5 * * 2"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Test and report only - no smoke test, no merge"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # Labels and comments on pull requests go through the issues API.
  issues: write

# Two overlapping runs would each spend their own smoke tests and merge into
# each other's way; the second one waits instead.
concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Full history: the script merges pull request branches locally.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Identity for the local test merges only; they are never pushed.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The order, the limit of three smoke tests and why the key is withheld
      # from npm ci: see scripts/weekly-update.js.
      - run: node scripts/weekly-update.js ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
