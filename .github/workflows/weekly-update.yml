name: Weekly update

on:
  schedule:
    # Tuesdays 05:17 UTC: a day after Dependabot's Monday run, so its pull
    # requests and their CI runs are done; off the full hour, when GitHub's
    # scheduler is busiest.
    - cron: "17 5 * * 2"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Test and report only - no smoke test, no merge"
        type: boolean
        default: false

# Nothing by default; each job asks for what it needs.
permissions: {}

# Two overlapping runs would each spend their own smoke tests and merge into
# each other's way; the second one waits instead.
concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  # Runs the code of the updates under test, so it gets a read-only token and
  # the Gemini key - never a token that can write. Why the jobs are split, the
  # order and the limit of three smoke tests: see scripts/weekly-update.js.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}

    steps:
      # Full history for the local test merges. No stored credentials: the
      # repository is public, fetching needs none, and code under test could
      # read them from .git/config.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Identity for the local test merges only; they are never pushed.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - run: node scripts/weekly-update.js test ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - id: plan
        run: echo "plan=$(cat weekly-update-plan.json)" >> "$GITHUB_OUTPUT"

  # Holds the write token and runs no dependency code: no npm ci, Node
  # built-ins only. It checks the plan instead of trusting it.
  merge:
    needs: test
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Labels and comments on pull requests go through the issues API.
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: |
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          node scripts/weekly-update.js merge "$RUNNER_TEMP/plan.json"
        env:
          PLAN: ${{ needs.test.outputs.plan }}
          GH_TOKEN: ${{ github.token }}

  # The free check of the key's model list, independent of the updates above.
  # Same split as test/merge: this job runs dependency code (npm ci) with the
  # Gemini key and a read-only token; the report job below holds the write
  # permission and runs no dependency code. See scripts/model-drift.js.
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.drift.outputs.drift }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Without install scripts, as in the test job; see docs/specs.md,
      # "Two jobs as a security boundary".
      - run: npm ci --ignore-scripts

      - id: drift
        run: |
          node scripts/model-drift.js check drift.json
          echo "drift=$(cat drift.json)" >> "$GITHUB_OUTPUT"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # Opens or updates one issue when something drifted; changes nothing else.
  drift-report:
    needs: drift
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: |
          printf '%s' "$DRIFT" > "$RUNNER_TEMP/drift.json"
          node scripts/model-drift.js report "$RUNNER_TEMP/drift.json"
        env:
          DRIFT: ${{ needs.drift.outputs.drift }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
