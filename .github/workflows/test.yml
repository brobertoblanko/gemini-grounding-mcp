name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The test suite only reads the repository; nothing is written back.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # One failing version should not hide the result of the others.
      fail-fast: false
      matrix:
        # 22 is the lower bound promised by "engines" in package.json and is in
        # Maintenance LTS until April 2027; 24 is in Maintenance LTS until
        # April 2028; 26 is Active LTS from 2026-10-28.
        node-version: [22, 24, 26]

    name: Node ${{ matrix.node-version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # "ci" rather than "install": it installs exactly what package-lock.json
      # pins and fails if the lockfile and package.json disagree.
      - run: npm ci

      # No API key is set here on purpose. The pure functions - citation
      # placement and footer formatting - never touch the network, and the
      # cases that spawn the CLI as a subprocess stop at an argument error
      # before any request goes out. test/helpers.js additionally overrides
      # the key with a placeholder, so none of them could reach the API even
      # if that ever changed. A run that suddenly needed a key would be a
      # regression.
      - run: npm test

  # Branch protection requires a check named "Tests", while the matrix jobs
  # report as "Node <version>" - without this job the required check never
  # arrives and every auto-merge waits forever. It gives the whole matrix one
  # stable name, so changing the matrix never touches the protection rule.
  # always() is load-bearing: a skipped required check counts as passed, so
  # without it a failed matrix would let the merge through.
  tests:
    name: Tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.test.result }}
