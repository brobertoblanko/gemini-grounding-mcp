name: Auto-Merge Dependabot

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # The PR author rather than github.actor: the actor changes to whoever
    # re-runs the workflow.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3

      # npm majors stay open for manual review. GitHub Actions majors are
      # merged too - they carry no runtime risk. The branch prefix identifies
      # the ecosystem, as Dependabot names its branches
      # "dependabot/github_actions/...". --auto only queues the merge; branch
      # protection still waits for the required "Tests" check.
      - name: Auto-merge
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' ||
          startsWith(github.head_ref, 'dependabot/github_actions/')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
