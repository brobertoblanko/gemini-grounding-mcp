version: 2

updates:
  # Weekly. Minor and patch updates are auto-merged by
  # .github/workflows/auto-merge.yml, major updates stay open for manual review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"

  # GitHub Actions: monthly, auto-merged - they carry no runtime risk.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci