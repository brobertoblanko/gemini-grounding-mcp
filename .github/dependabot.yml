version: 2

# Dependabot only opens pull requests. Testing and merging happens once a week
# in .github/workflows/weekly-update.yml, which is what the grouping below is
# shaped for: minor and patch updates are tested together, majors one by one.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Transitive dependencies are only ever updated by security updates -
      # version updates leave them alone for npm. Grouped as well, so that a
      # week's fixes arrive as one pull request instead of one each.
      security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # No group for majors on purpose: each one is its own pull request,
    # because the weekly update merges and tests them one at a time.

  # Monthly, in one pull request. Merged without a smoke test - actions only
  # change how CI runs and never reach the server.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
