version: 2

updates:
  # Minor and patch updates: weekly, auto-merged via CI workflow.
  # Major updates: monthly, kept open for manual review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"

  # GitHub Actions: monthly, auto-merged - they carry no runtime risk.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci